# 共享内核文件清单（shared-kernel-manifest.yaml）
# 用途：全部卡片 import 路径的唯一权威来源。卡片中出现本清单以外的共享路径即视为卡片缺陷。
# 维护：P0-01 / P0-02 / P0-03 / P0-04 创建；INT-03 状态刷新时回写实际文件。

version: 1
project: paike
round: v1
generatedAt: 2026-10-19

aliases:
  backend:
    "@/": "backend/src/"
    "@modules/": "backend/src/modules/"
  frontend:
    "@/": "frontend/src/"
    "@views/": "frontend/src/views/"

ownershipRules:
  - "shared/ 不得 import modules/ 下任何文件"
  - "modules/ 之间不得直接 import 对方的 repository/domain"
  - "跨域查询只经对方暴露的 *.query-service.ts"
  - "frontend/src/views/<context>/ 只 import @/shared 与 @/api/<context>.api"

entries:
  # ---------------------------------------------------------------------------
  # P0-01 数据库基础设施
  # ---------------------------------------------------------------------------
  - id: db.pool
    side: backend
    path: backend/src/shared/db/pool.ts
    import: "@/shared/db/pool"
    exports: [db, query, queryOne, queryMany, healthCheck, closePool]
    ownerCard: P0-01

  - id: db.transaction
    side: backend
    path: backend/src/shared/db/transaction.ts
    import: "@/shared/db/transaction"
    exports: [withTransaction, Tx]
    ownerCard: P0-01

  - id: db.migrate
    side: backend
    path: backend/src/shared/db/migrate.ts
    import: "@/shared/db/migrate"
    exports: [runMigrations, listAppliedMigrations]
    ownerCard: P0-01

  # ---------------------------------------------------------------------------
  # P0-02 认证 / 会话 / 权限
  # ---------------------------------------------------------------------------
  - id: auth.session
    side: backend
    path: backend/src/shared/auth/session.ts
    import: "@/shared/auth/session"
    exports: [sessionMiddleware, createSession, destroySession, touchSession, assertSessionValid]
    ownerCard: P0-02

  - id: auth.password
    side: backend
    path: backend/src/shared/auth/password.ts
    import: "@/shared/auth/password"
    exports: [hashPassword, verifyPassword, validatePasswordPolicy, generateInitialPassword]
    ownerCard: P0-02

  - id: auth.rbac
    side: backend
    path: backend/src/shared/auth/rbac.ts
    import: "@/shared/auth/rbac"
    exports: [requireAuth, requireRole, requireAdmin, loadCurrentUser, canAccessTeacherResource]
