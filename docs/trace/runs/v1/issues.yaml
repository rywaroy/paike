      ## 验收标准
      - 七类关键操作逐一验证「未确认零变更、确认后生效」。
      - 跨域引用保护：模板被学期钉扎、教师有任课/班主任/账号、科目有任课、场地被占用、年级有班级，删除均被拒绝并提示关系。
      - 并发：同一方案两请求先提交成功、后提交 409 且零写入；主数据同样。
      - 权限：Teacher 对全部管理 API 403；五视图/空闲本人范围；角色变更下一请求生效。
      - D15 全链路：主数据→生成→发布→五视图→导出逐格一致。
      - 学期隔离：切换后列表/课表/统计/日志无串扰。
      - 存档只读：写接口 409，查看/导出可用。
      - 日志一致性：关键操作次数与日志条数一一对应。

      ## 相关背景
      - 本卡不新增业务能力，只做跨卡验收与缺陷收口。
      - 依赖全部领域卡完成。
      - CM-006 为孤儿并发用例，本卡以设计口径验证（H-01）。

      ## 约束
      - 不为通过测试修改期望表或放宽约束。
      - 缺陷必须回到对应领域卡修复，不在本卡打补丁。
      - 所有用例使用固定锚点与固定时钟。

      ## 当前阶段
      设计态。定义集成验收清单；不写实现、不执行。

      ## 任务
      1. 编写七类确认的端到端脚本。
      2. 编写引用保护矩阵脚本。
      3. 编写并发冲突脚本。
      4. 编写权限矩阵脚本。
      5. 编写 D15 全链路脚本。
      6. 编写学期隔离与存档只读脚本。
      7. 编写日志一致性脚本。
      8. 汇总缺陷并回派。

      ## 验证
      1. 七类操作各执行「取消/确认」两遍，断言取消后数据与日志均不变。
      2. 并发两请求，断言先者 200、后者 409、最终等于先者结果。
      3. Teacher 遍历管理端点，断言全部 403。
      4. D15 全链路逐格断言 30 格一致，导出文件同值。
      5. 存档后遍历写端点，断言 409；GET/导出 200。

      ## 在开始改动之前
      - 阅读 `p3-contracts.md` §7、`conventions.md` §9、全部卡片验收标准。
      - 确认所有领域卡已完成并可启动。
      - 不使用真实学校数据。

      ## 完成改动之后
      - 输出集成报告与缺陷清单。
      - 更新 `test-results/INT-01.md` 的执行状态（实现轮次）。
      - 触发 INT-02。

      ## 测试案例对比验证
      - 涉及用例：TC-CM-001/002/006（参考）、TC-AP-017、TC-LG-001/005、TC-AU-007/008、TC-AT-002/003、TC-BD-005。
      - 已定结果：七类确认、引用保护、并发最终一致、权限边界、D15 全链路、隔离与只读均成立。
      - 设计预期结果（静态推演，未执行）：各卡按契约实现后上述断言成立；并发按 H-01 先提交者成功、后提交者 409。
      - 一致性判定：一致（设计态）。
      - 孤儿说明：CM-006 整体孤儿，按 H-01 口径验证但标注不计覆盖。
      - 执行状态：未执行。

