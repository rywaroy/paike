      ## 约束
      - 扫描不得依赖手工维护的清单。
      - 不引入运行时反射或动态 import 之外的重型框架。
      - 边界错误必须给出文件与 import 路径。

      ## 当前阶段
      设计态。定义扫描约定与规则；不写实现。

