      ## 目标
      通过约定式扫描自动装配后端路由与前端路由，并用 ESLint/TS 门禁强制上下文边界。

      ## 验收标准
      - 新增 `modules/<context>/<context>.router.ts` 无需手工注册即可被 `modules/index.ts` 发现。
      - 新增 `views/<context>/routes.ts` 无需手工注册即可被前端路由发现。
      - ESLint 阻止 `shared → modules`、领域间 repository/domain 直接引用。
      - `npm run typecheck` 与 `npm run lint` 在骨架代码上通过。

      ## 相关背景
      - conventions §2.2 要求 Hub 文件约定式扫描。
