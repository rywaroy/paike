  - id: D09
    name: 批量导入
    phase: 3
    priority: P1
    labels: [backend, frontend, exchange]
    estimate_point: 8
    blocked_by: [D01, D02, D03, D04]
    description: |
      ## 目标
      实现学期/年级/班级/科目/教师/任课/场地七类 XLSX 导入，含模板、预览、行级错误、批次记录与上限控制。

      ## 验收标准
      - 提供七类固定模板下载；XLSX 为主，接受 UTF-8 CSV，拒绝 GBK。
      - 文件 >20MB 或数据行 >5000 → 整份拒绝、零写入，提示行数与上限。
      - 必填列缺失整份拒绝；未知列忽略并在报告提示。
      - 预览返回前 20 行与表头校验结果，不写库。
      - ≤5000 行逐行校验：合法行入库、非法行跳过；重复键按非法行处理，不做 upsert。
      - 返回 total/success/failed/status/errors/errorReportUrl；错误含行号、列名、原值、中文原因。
      - 导入提交二次确认，写 operation_log（IMPORT）。
      - 数据库故障整批回滚，批次 FAILED。

      ## 相关背景
      - PRD F18、R-038、A-07、H-04、M-08。
      - `exchange` 为应用模块，调用各域应用服务落库。
      - 导入批次表由本卡创建。

      ## 约束
      - 迁移序号：`0032_exchange_import.sql`。
      - 不改各域实体；只调用其应用服务。
      - 错误报告一次性下载，UTF-8 BOM。
      - 不实现 upsert/覆盖导入。

      ## 当前阶段
      设计态。定义模板、流程与错误契约；不写实现。

      ## 任务
      1. 建表 import_batch。
      2. 实现模板生成与下载。
      3. 实现上传、解析、表头校验与预览。
      4. 实现逐行校验与调用各域应用服务。
      5. 实现错误报告 CSV 与批次查询。
      6. 前端：导入向导（上传→预览→结果→错误下载）。
      7. 接入确认与日志。

      ## 验证
      1. 导入 5001 行文件，断言 400/413、零写入、提示上限。
      2. 导入含 3 条非法行的文件，断言合法行入库、非法行错误含行号/列名/原值/原因。
      3. 缺必填列文件，断言整份拒绝、零写入。
      4. 重复键行断言按非法行处理，原有记录未被覆盖。
      5. 预览 20 行断言不写库；提交后断言批次记录与操作日志各一条。

      ## 在开始改动之前
      - 阅读 PRD F18、`p3-contracts.md` §3.3、A-07、H-04。
      - 确认各域应用服务与 DTO 可用。
      - 不使用 GBK 解析器。

      ## 完成改动之后
      - 输出模板字段与错误码对照。
      - 输出批次表索引。
      - 更新契约。

      ## 测试案例对比验证
      - 涉及用例：TC-BD-013/025、TC-CM-004/005。
      - 已定结果：
        - BD-013 部分成功、行级错误（G，M-08）。
        - BD-025 任课导入行级错误（G，M-08）。
        - CM-004 超 5000 行整份拒绝（R）。
        - CM-005 部分成功不回滚（R）。
      - 设计预期结果（静态推演，未执行）：上限双重校验、逐行提交与错误报告可满足。
      - 一致性判定：一致。
      - 孤儿说明：无（CM-006 不属本卡）。
      - 执行状态：未执行。

  - id: D10
    name: Excel 导出与模板打印
    phase: 3
    priority: P1
    labels: [backend, frontend, exchange, print]
    estimate_point: 8
    blocked_by: [D05, D06, D11]
    description: |
      ## 目标
      实现基础数据/课表/统计三维度 XLSX 导出，以及打印模板管理、服务端 PDF 预览与打印。

      ## 验收标准
      - 三维度导出可用；文件名含维度与学期；列名/顺序/取值与页面逐字段一致。
      - XLSX 只含值；日期 `YYYY-MM-DD`、时间 `HH:mm`；空值为空；冻结表头。
      - 1000 行 × 12 列服务端生成 p95 ≤3s。
      - 导出操作写安全审计，不要求二次确认。
      - 打印模板支持名称、纸张 A4/A3、横纵向、边距、标题、校徽（PNG ≤2MB）。
      - 预览与打印返回同一份 PDF；受保护 HTML 使用 60 秒一次性 token。
      - 预设模板不可删除；打印写安全审计。

      ## 相关背景
      - PRD F15/F16、R-032/R-033、H-04、M-11/M-14。
      - 列字典是唯一来源，禁止页面与导出各维护一套。
      - `exchange` 只读各域查询服务。

      ## 约束
      - 迁移序号：`0033_exchange_print.sql`。
      - 不把导出文件长期落库；临时文件 10 分钟清理。
      - 不引入第二套打印引擎。
      - 校徽只接受 PNG，拒绝 SVG。

      ## 当前阶段
      设计态。定义导出列、打印模板与 PDF 契约；不写实现。

      ## 任务
      1. 建表 print_template。
      2. 实现列字典与三维度导出。
      3. 实现模板 CRUD、校徽上传与预设保护。
      4. 实现 HTML 模板与 Playwright `renderPdf`。
      5. 实现预览/打印接口与一次性 token。
      6. 前端：导出页、打印设置页、预览。
      7. 补充性能与一致性测试。

      ## 验证
      1. 导出 1000×12，断言 p95 ≤3s、文件可被 Excel 打开、表头冻结。
      2. 逐字段比对导出与页面值，断言列名、顺序、取值一致。
      3. 调用预览与打印，断言返回 PDF 字节完全一致。
      4. 上传 2.1MB PNG 断言 413；SVG 断言 400。
      5. 删除预设模板断言 409；过期 token 访问返回 401/403。

      ## 在开始改动之前
      - 阅读 PRD F15/F16、`p3-contracts.md` §3.4/§3.5、H-04。
      - 确认 D05/D06/D11 查询服务可用。
      - 安装 Chromium 运行时（`npx playwright install chromium`）。

      ## 完成改动之后
      - 输出列字典与模板字段。
      - 输出 PDF 生成耗时。
      - 更新契约。

      ## 测试案例对比验证
      - 涉及用例：TC-EX-001。
      - 孤儿：TC-EX-002/003（整体孤儿，不计覆盖；仅作打印/导出设计参考）。
      - 已定结果：EX-001 三维度导出、文件名、逐字段一致、可打开（G，M-11）。
      - 设计预期结果（静态推演，未执行）：列字典单一来源与同一 PDF 渲染可满足；性能按 H-03 基准验证。
