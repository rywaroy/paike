  - id: P0-08
    name: 登录、强制改密、错误页与会话失效
    phase: 0
    priority: P0
    labels: [frontend, auth, ux]
    estimate_point: 5
    blocked_by: [P0-02, P0-04]
    description: |
      ## 目标
      实现用户友好的登录页、强制改密页、403/404 页与会话失效处理。

      ## 验收标准
      - `/login` 含用户名、密码、登录按钮；错误统一「用户名或密码错误」；锁定提示剩余分钟。
      - 登录成功按角色落地：Admin `/`，Teacher `/me/timetable`。
      - `mustChangePassword=true` 强制跳 `/change-password`，其他受保护路由不可达。
      - 改密页实时展示密码策略；成功后要求重新登录。
      - 会话失效任意 401 → 跳登录并携带 `redirect`，提示「登录已失效，请重新登录」。
      - 403/404 页说明原因并提供返回入口。
      - 登录页不提供任何演示账号、默认密码提示或「一键填充」。

      ## 相关背景
      - PRD F20 涉及登录账户密码，界面必须完整设计。
      - H-02 定义了锁定与初始密码规则。
      - 原型演示登录按钮属于剔除项。

      ## 约束
      - 不显示账号是否存在；不显示技术错误。
      - 初始密码只在创建/重置时展示一次。
      - 密码输入支持显示/隐藏切换；不自动填充。

      ## 当前阶段
      设计态。定义页面、状态与文案；不写实现。

      ## 任务
      1. 实现 `LoginView.vue`。
      2. 实现 `ChangePasswordView.vue`（强制/主动两种模式）。
      3. 实现 403/404 页面。
      4. 实现 401 拦截与回跳。
      5. 实现锁定倒计时与禁用提交。
      6. 补充组件测试。

      ## 验证
      1. 输入错误密码，断言页面只显示统一文案、不显示账号存在性。
      2. 连续失败触发锁定，断言按钮禁用并显示「请 15 分钟后再试」。
      3. 首次登录后断言被重定向到 `/change-password`，直接访问 `/semesters` 被弹回。
      4. 改密成功后再访问受保护页，断言要求重新登录。
      5. 在受保护页使会话失效，断言跳登录且 `redirect` 保留原路径。

      ## 在开始改动之前
      - 阅读 P0-02 接口契约、`roles.md`、`conventions.md` §6.4。
      - 确认 `/auth/me` 返回 `mustChangePassword`。
      - 不复制原型演示脚本。

      ## 完成改动之后
      - 输出登录/改密/错误页文案清单。
      - 记录角色落地规则。
      - 更新 README 默认管理员说明。

      ## 测试案例对比验证
      - 涉及用例：O-AU-006-LOGIN、O-BD-022-LOGIN、O-AU-009-LOGIN；TC-AU-007（越权提示）。
      - 已定结果：默认凭据可登录；教师账号首次登录成功且仅见本人功能；越权被拒绝。
      - 设计预期结果（静态推演，未执行）：登录与强制改密流程可完成；教师登录后落 `/me/timetable`；越权跳 403。
      - 一致性判定：一致。
      - 孤儿说明：三条登录子断言由 H-02 转可执行；AU-001/002/003/005 仍不计覆盖。
      - 执行状态：未执行。

  - id: D01
    name: 学期、作息模板与校历
    phase: 1
    priority: P0
    labels: [backend, frontend, registry]
    estimate_point: 8
    blocked_by: [P0-06]
    description: |
      ## 目标
      实现学期 CRUD、状态推导、模板与不可变版本、校历停课/调休，以及学期钉扎模板版本。

      ## 验收标准
      - 学期列表显示「学期 / 学年 / 起止日期 / 引用作息模板 / 状态」五字段。
      - 状态仅为 NOT_STARTED / IN_PROGRESS / ENDED / ARCHIVED；前三值按日期实时推导，存档为存储态。
      - 新增学期未选模板被拒绝，提示「请选择作息模板」。
      - 模板编辑保存生成新版本，历史版本逐字段不变；引用旧版本的学期仍读旧版本。
      - 节次校验：编号从 1 连续、单节起止有效、同日不重叠、开放星期非空。
      - 校历支持停课/调休，停课周占周序号。
      - 已存档学期编辑返回 `409 STATE_CONFLICT`，查看/导出可用。
      - 删除被引用模板/学期返回 `REFERENCE_PROTECTED`。

      ## 相关背景
      - PRD F1/F2、R-001/R-002/R-003/R-046、A-01/A-08。
