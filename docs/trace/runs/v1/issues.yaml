issues:
  - id: P0-01
    name: 数据库、迁移运行器与共享表
    phase: 0
    priority: P0
    labels: [backend, database, foundation]
    estimate_point: 5
    blocked_by: []
    description: |
      ## 目标
      建立 PostgreSQL 16 连接池、顺序迁移运行器与 8 张共享基础设施表，为全部后续卡片提供唯一数据库入口。

      ## 验收标准
      - 空库执行 `npm run db:migrate` 成功，重复执行幂等。
      - 存在 `sys_migration`、`sys_user`、`sys_session`、`sys_login_attempt`、`sys_config`、`sys_controlled_vocabulary`、`sys_outbox_event`、`sys_audit_log`。
      - `set_updated_at()` 触发器生效；所有表含 `created_at`/`updated_at`。
      - `GET /api/v1/health` 返回 `{ data: { status: "ok", db: true } }`。
      - 连接池耗尽或数据库不可用时健康检查返回明确错误且进程不崩溃。

      ## 相关背景
      - `schema-shared.sql` 是共享表唯一 DDL 来源；领域表不在本卡创建。
      - H-02 要求 Argon2id、服务端会话、登录失败锁定，相关字段必须在本卡落位。
      - 主键统一 uuid，应用层生成。

      ## 约束
      - 迁移只追加，不修改已执行文件；文件命名 `NNNN_name.sql`。
      - 本卡迁移序号：`0001_create_shared_tables.sql`、`0002_create_updated_at_trigger.sql`。
      - 禁止在本卡创建任何领域表；禁止引入 ORM。
      - 密码、Cookie、Token 不得写入日志。

      ## 当前阶段
      设计态。只定义表、迁移与连接池契约；不写实现。

      ## 任务
      1. 实现 `config/database.ts`：读取 `DATABASE_URL`，Zod 校验，创建 `pg.Pool`。
      2. 实现 `shared/db/pool.ts` 与 `shared/db/transaction.ts`（`withTransaction`）。
      3. 实现迁移运行器：按文件名排序、事务执行、写 `sys_migration`、校验 checksum。
      4. 落地 `schema-shared.sql` 8 张表、索引、枚举与触发器。
      5. 实现健康检查路由。
      6. 补充迁移与连接的单元测试。

      ## 验证
      1. `npm run db:migrate` 在空库执行两次，第二次输出「无待执行迁移」，表数量不变。
      2. 查询 `information_schema.tables`，断言 8 张共享表全部存在且列名与 `schema-shared.sql` 一致。
      3. 两条并发事务写同一 `sys_config` 键，断言后提交者 409 或等待后成功，无脏写。
      4. `curl /api/v1/health` 断言 `status=ok`、`db=true`。

      ## 在开始改动之前
      - 阅读 `schema-shared.sql`、`conventions.md` §4、`docs/knowledge/config-contract.md`。
      - 确认本机 PostgreSQL ≥16 可用；不得修改 `schema-shared.sql` 已冻结的表名。
      - 检查是否已有迁移运行器，避免重复实现。

      ## 完成改动之后
      - 输出迁移清单与执行结果。
      - 更新 `README.md` 快速启动中的数据库步骤（如需）。
      - 在 `docs/memory/2026-10-19.md` 记录实际迁移序号。

      ## 测试案例对比验证
      - 涉及用例：无直接功能用例；为 TC-AU-006（预置 Admin）与全部数据类用例提供基础。
      - 已定结果：空库迁移成功、共享表存在、健康检查可用。
      - 设计预期结果（静态推演，未执行）：迁移幂等，8 表齐全，`sys_user` 可承载 admin 与教师账号，`sys_session` 支持撤销，`sys_outbox_event` 支持同事务事件。
      - 一致性判定：一致（结构性支撑，无行为冲突）。
      - 孤儿说明：不涉及孤儿用例。
      - 执行状态：未执行。

  - id: P0-02
    name: 认证、会话与安全基线
    phase: 0
    priority: P0
    labels: [backend, auth, security]
    estimate_point: 8
    blocked_by: [P0-01]
    description: |
      ## 目标
      实现本地账号登录、退出、改密、服务端会话、CSRF、RBAC 与登录失败锁定，满足 H-02 最小安全基线。

      ## 验收标准
      - `POST /auth/login` 正确账号返回用户信息与 `mustChangePassword`；错误统一「用户名或密码错误」。
      - 同用户名 + IP 15 分钟内失败 5 次锁定 15 分钟，返回 `423 ACCOUNT_LOCKED`。
      - 会话 Cookie `paike.sid` 为 HttpOnly、SameSite=Lax；空闲 8h、绝对 7d。
      - 退出后会话立即失效；停用账号下一请求返回 401。
      - 所有非 GET 请求缺少或错误 `X-CSRF-Token` 返回 403。
      - 密码以 Argon2id 存储；策略 ≥8 位且四类中至少三类。
      - 首次登录 `mustChangePassword=true` 时，除改密/退出外接口返回 `403 STATE_CONFLICT`。

      ## 相关背景
      - PRD F20 要求本地账号与默认管理员；DDD Account 缺密码字段，由 H-02 补全。
      - `sys_user`/`sys_session`/`sys_login_attempt` 由 P0-01 建表。
      - 角色每请求从数据库读取（A-18）。

      ## 约束
      - 不引入第三方身份提供商；不存明文/可逆密码。
      - 登录失败文案不区分账号不存在与密码错误。
      - 不得把密码、Cookie、CSRF Token 写入任何日志。
      - 会话存储使用 PostgreSQL，不使用内存 Store。

      ## 当前阶段
      设计态。定义接口、状态与安全参数；不写实现。

      ## 任务
      1. 实现 `shared/auth/password.ts`（Argon2id hash/verify）与密码策略校验。
      2. 配置 `express-session` + PG Store，Cookie 与超时参数从环境变量读取。
      3. 实现登录、退出、`/auth/me`、改密接口。
      4. 实现 CSRF 双提交中间件与 `GET /auth/csrf`。
      5. 实现 `loadCurrentUser`、`requireAuth`、`requireRole`；每请求读库。
      6. 实现登录失败计数与锁定；写 `sys_audit_log`。
      7. 实现强制改密守卫。

      ## 验证
      1. Supertest：正确登录 200 且写会话；错误密码 401 且文案不含账号存在性；连续 5 次失败后第 6 次 423。
      2. 等待锁定窗口后正确密码登录成功；断言 `sys_login_attempt` 计数重置。
      3. 退出后携带旧 Cookie 请求 `/auth/me` 返回 401。
      4. 无 CSRF Token 的 POST 返回 403；带正确 Token 成功。
      5. 强制改密用户访问 `/semesters` 返回 403；访问 `/auth/change-password` 成功。

      ## 在开始改动之前
      - 阅读 `roles.md`、`docs/knowledge/config-contract.md`、H-02 裁决全文。
      - 确认 P0-01 的共享表已可用；不得私建 `sys_user` 副本。
      - 检查现有中间件顺序，避免 CSRF 在会话之前执行。

      ## 完成改动之后
      - 记录安全参数实际值（不含密钥）。
      - 更新 `P0-03` 可复用的鉴权导出清单。
      - 写安全审计用例说明。

      ## 测试案例对比验证
      - 涉及用例：TC-AU-006（预置 Admin，依赖 P0-05 seed）、O-AU-006-LOGIN、O-BD-022-LOGIN、O-AU-009-LOGIN；孤儿 TC-AU-001/002/003/005 仅作参考。
      - 已定结果：首次初始化存在唯一 Admin；默认凭据可登录；教师账号首次登录成功且权限为 Teacher。
      - 设计预期结果（静态推演，未执行）：H-02 参数下 admin 首次登录返回 `mustChangePassword=true`，改密后进入概览；教师首次登录同样强制改密；错误/锁定/停用路径返回约定状态码。
      - 一致性判定：一致（登录子断言由 H-02 转为可执行）。
      - 孤儿说明：AU-001/002/003/005 无承载卡片，不计入覆盖；本卡不声称覆盖。
      - 执行状态：未执行。

  - id: P0-03
    name: 共享内核（HTTP、错误、校验、事件、审计、时间）
    phase: 0
    priority: P0
    labels: [backend, shared-kernel]
    estimate_point: 8
    blocked_by: [P0-01]
    description: |
      ## 目标
      提供全后端复用的响应封装、错误模型、Zod 校验、乐观版本、outbox、业务/安全审计、时钟、教学周与时段表达式。

      ## 验收标准
      - 成功响应统一 `{ data }`；列表统一 `{ data: { items, page, pageSize, total } }`；失败统一 `{ error: { code, message, details, requestId } }`。
      - `AppError` 覆盖 conventions §3.2 全部错误码，HTTP 映射正确。
      - 写请求版本守卫工具在版本不匹配时抛 `VERSION_CONFLICT` 且不写库。
      - `outbox.enqueue(tx, event)` 与业务写入同事务；dispatcher 至少一次投递。
      - `operationLog.write(tx, entry)` 只追加；`securityAudit.write` 记录认证与越权。
      - 周次计算：第 1 周为学期开始所在周，停课周占序号，奇偶继续推进（H-05）。
      - 时段表达式解析与校验覆盖 `weekday`、`period`、`parity`。

      ## 相关背景
      - R-022、R-039、R-047 依赖本卡。
      - 所有领域卡只能消费本卡能力，不得重复实现。
      - `shared-kernel-api.md` 是签名唯一来源。

      ## 约束
      - `shared/` 禁止 import 任何 `modules/`。
      - 不记录敏感信息；手机号脱敏。
      - 不使用随机数生成业务结果；时间统一经 `Clock`。

      ## 当前阶段
      设计态。定义模块接口与行为；不写实现。

      ## 任务
      1. 实现 `shared/http/envelope.ts` 与错误中间件。
      2. 实现 `shared/errors/app-error.ts`、`codes.ts`。
      3. 实现 `shared/validation/common.ts`（uuid、分页、版本、日期、时段）。
      4. 实现 `shared/db/optimistic.ts`。
      5. 实现 `shared/events/outbox.ts` 与 dispatcher。
      6. 实现 `shared/audit/operation-log.ts`、`security-audit.ts`。
      7. 实现 `shared/time/clock.ts`、`academic-week.ts`、`slot-expression.ts`。
      8. 补充单元测试（周次、时段、错误映射）。

      ## 验证
      1. 单测：给定学期 2026-09-01（周二）与停课周，断言第 1 周为单周、停课周仍占序号、下一周奇偶正确。
      2. 单测：版本守卫在 `version` 不匹配时抛 `VERSION_CONFLICT`，且仓储未被调用。
      3. 单测：outbox 事务回滚时事件不落库；提交后 dispatcher 可读取。
      4. 接口测试：未知异常返回 `INTERNAL_ERROR` 且含 `requestId`，不泄露堆栈。

      ## 在开始改动之前
      - 阅读 `shared-kernel-manifest.yaml`、`shared-kernel-api.md`、`conventions.md` §3/§7。
      - 确认 P0-01 的 outbox/audit 表可用。
      - 不得新增与既有导出同名的工具。

      ## 完成改动之后
      - 更新 manifest 与实际文件差异。
      - 为后续卡片列出可直接使用的 import。
      - 记录时钟注入方式。

      ## 测试案例对比验证
      - 涉及用例：间接支撑 TC-LG-001/002（日志）、TC-CM-006（并发，孤儿）、TC-AP-013（周次）。
      - 已定结果：日志字段齐全可筛选；并发后提交者 409 且零写入；第 1 周单周。
      - 设计预期结果（静态推演，未执行）：统一封装与版本守卫可满足上述断言；周次算法在停课周口径下推进奇偶。
      - 一致性判定：一致（能力支撑，行为由各领域卡验证）。
      - 孤儿说明：TC-CM-006 无承载卡片，不计覆盖；本卡仅提供并发原语。
      - 执行状态：未执行。

  - id: P0-04
    name: 前端骨架、布局、路由守卫与共享组件
    phase: 0
    priority: P0
    labels: [frontend, foundation, ux]
    estimate_point: 8
    blocked_by: [P0-01, P0-02, P0-03]
    description: |
      ## 目标
      创建 Vue 3 + TS + Vite 应用骨架，完成角色化布局、路由守卫、API 客户端、共享组件与全站中文文案规范。

      ## 验收标准
      - 未登录访问任意受保护路由跳 `/login?redirect=...`。
      - 角色不符跳 `/403`；强制改密期间仅可访问 `/change-password`。
      - Admin 导航含全部管理入口；Teacher 仅「我的课表」「我的空闲时段」「退出登录」。
      - `shared/api/http.ts` 统一注入 CSRF、处理 401/409、提取中文 `message`。
      - `ConfirmDialog` 可用于七类关键操作，展示操作、对象、影响、可撤销性。
      - `EmptyState`/`ErrorState`/`DataTable`/`FormDrawer` 可复用且文案中文。
      - 全站不展示枚举值、错误码、HTTP 状态码、SQL、堆栈。

      ## 相关背景
      - 原型仅作界面参考；演示登录、需求面板、页面切换器已剔除。
      - A-21 要求五视图共享组件；R-035 要求七类二次确认。
      - 教师端导航不得出现任何管理入口（TC-AT-004）。

      ## 约束
      - 桌面优先，最小宽度 1280px；不引入第二套 UI 框架。
      - 不在组件中直接 `fetch`；必须经 `shared/api/<domain>.api.ts`。
      - 不做乐观更新；写成功后刷新查询。
      - 颜色不得作为唯一信息载体。

      ## 当前阶段
      设计态。定义路由表、组件契约与文案规则；不写实现。

      ## 任务
      1. 初始化 Vite + Vue 3 + TS + Pinia + Vue Router + Element Plus。
      2. 实现 `AppLayout`、`SideNav`、顶部学期选择器与用户菜单。
      3. 实现路由表与守卫（会话 → 强制改密 → 角色）。
      4. 实现 `shared/api/http.ts` 与各域 api 文件骨架。
      5. 实现 `ConfirmDialog`、`DataTable`、`FormDrawer`、`EmptyState`、`ErrorState`、`TimetableGrid` 骨架。
      6. 实现 `useSessionStore`、`useSemesterStore`、`useConfirm`、`messages.ts`。
      7. 落地 `conventions.md` §6.4 文案规则。

      ## 验证
      1. 未登录访问 `/semesters` 断言重定向到 `/login?redirect=/semesters`。
      2. Teacher 登录后渲染导航，断言不含「学期」「排课」「统计」「用户」等文本。
      3. 触发一次 409 响应，断言界面显示中文刷新提示且不显示 `VERSION_CONFLICT`。
      4. 打开 `ConfirmDialog`，断言含操作名、影响说明、取消与确认按钮。
      5. 键盘 Tab 遍历主要操作，断言焦点可到达且对话框焦点被捕获。

      ## 在开始改动之前
      - 阅读 `README.md` §5、`conventions.md` §6、`roles.md` §5。
      - 确认 P0-02 的 `/auth/me` 与 CSRF 接口可用。
      - 不复制原型中的演示脚本与假数据。

      ## 完成改动之后
      - 更新路由清单与导航截图说明。
      - 输出共享组件 props/events 契约。
      - 登记仍需各域补充的页面。

      ## 测试案例对比验证
      - 涉及用例：TC-CM-001（七类二次确认）、TC-AT-004（教师导航）。
      - 已定结果：七类操作均先确认且未确认零变更；Teacher 导航无管理入口。
      - 设计预期结果（静态推演，未执行）：统一 `ConfirmDialog` 与角色化导航可满足；各域页面接入后逐项验证。
      - 一致性判定：一致（框架支撑，业务确认由各卡与 INT-01 验证）。
      - 孤儿说明：无。
      - 执行状态：未执行。

  - id: P0-05
    name: Seed 锚点、受控词表与预置管理员
    phase: 0
    priority: P0
    labels: [backend, database, seed]
    estimate_point: 3
    blocked_by: [P0-01, P0-02]
    description: |
      ## 目标
      提供可重复执行的 seed：唯一预置 Admin、受控词表与同义词、D15 固定 UUID 锚点。

      ## 验收标准
      - `npm run db:seed` 在空库与已有库均成功（幂等）。
      - 存在且仅存在一个预置 Admin（username=admin，role=ADMIN，status=ENABLED）。
      - 初始密码来自 `PAIKE_ADMIN_INITIAL_PASSWORD`；未设置时控制台仅输出一次，不写日志文件。
      - D15 锚点 UUID 固定，重复执行不产生重复记录。
      - 受控词表含年级、科目、场地名称及科目同义词。

      ## 相关背景
      - TC-AU-006 要求唯一预置 Admin；D15 是全系统公共断言基准。
      - `seed-anchors.sql` 已定义固定 UUID 后缀与 `to_regclass` 守卫。
      - H-02 要求首次登录强制改密。

      ## 约束
      - 不修改 `seed-anchors.sql` 中已定 UUID 语义。
      - 不把初始密码写入版本库、日志或文档。
      - 锚点数据不得被测试删除；测试使用独立事务回滚。

      ## 当前阶段
      设计态。定义 seed 内容与幂等策略；不写实现。

      ## 任务
      1. 实现 `npm run db:seed` 执行器。
      2. 写入 admin（Argon2id、must_change_password=true）。
      3. 写入受控词表与同义词。
      4. 写入 D15 锚点：学期、模板/版本、年级、A/B 班、数学/英语、张/李、301、四条任课。
      5. 输出一次性初始密码策略。
      6. 补充 seed 幂等测试。

      ## 验证
      1. 空库执行 seed 两次，断言 `sys_user` 中 admin 仅一条、D15 锚点各表记录数不变。
      2. 断言未设置环境变量时控制台只出现一次初始密码，且日志文件不含该字符串。
      3. 使用 admin + 初始密码登录，断言 `mustChangePassword=true`。
      4. 查询 D15 锚点，断言 A/B 班、两位教师、两科目、301 场地与四条任课均可读。

      ## 在开始改动之前
      - 阅读 `seed-anchors.sql`、PRD 附件 A、`docs/knowledge/config-contract.md`。
      - 确认 P0-02 的密码哈希与账号字段可用。
      - 不得改动固定 UUID 后缀。

      ## 完成改动之后
      - 在 README 标注默认管理员与首次改密。
