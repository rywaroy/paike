  - id: D11
    name: 工作量统计
    phase: 2
    priority: P1
    labels: [backend, frontend, statistics]
    estimate_point: 5
    blocked_by: [D05]
    description: |
      ## 目标
      实现教师工作量统计：常规/连堂/合班/加班四列，周与学期两种口径。

      ## 验收标准
      - 统计表含四列；每条课次只入一类，优先级：合班 > 连堂 > 常规。
      - 连堂按实际节次计；合班按 1 节计；各列之和等于总课时。
      - 加班恒为 0，显示占位并明示「细则 V1.1」。
      - 周口径按指定教学周 `ALL + 对应奇偶` 计算；学期口径累计全部教学周。
      - 只统计当前 `PUBLISHED` 方案；无正式课表返回空并提示「请先发布课表」。
      - 跨年级任课课时累计正确。

      ## 相关背景
      - PRD F14、R-031、A-16、M-17。
      - `statistics` 为应用模块，读 `WorkloadQueryService` 与教师查询服务。
      - 统计口径必须与导出/页面一致。

      ## 约束
      - 不新增统计表；实时计算或只读聚合。
