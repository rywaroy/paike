      - 迁移序号：`0010_registry_semester.sql`、`0011_registry_template_calendar.sql`。
      - 模板版本表不可变，无 `updated_at`。
      - 只通过 `SemesterQueryService`/`TemplateQueryService` 对外提供读能力。
      - 禁止直接写 timetable 表。

      ## 当前阶段
      设计态。定义聚合、表、API 与校验；不写实现。

      ## 任务
      1. 建表与迁移：semester、schedule_template、schedule_template_version、calendar_exception。
      2. 实现学期应用服务、仓储、DTO 与路由。
      3. 实现状态推导与存档只读守卫。
      4. 实现模板/版本服务与节次校验。
      5. 实现校历停课/调休。
      6. 实现引用保护。
      7. 前端：学期列表、模板版本、校历页面。
      8. 导出查询服务接口。

      ## 验证
      1. 新增学期缺 `scheduleTemplateVersionId` 返回 400，断言库中无记录。
      2. 编辑模板生成 v2，断言 v1 行逐字段未变且学期仍引用 v1。
      3. 在 v1 上保存非法节次（编号跳号/时间倒置）返回 400 与字段级错误。
      4. 构造日期使学期处于 IN_PROGRESS，断言状态推导；存档后 PATCH 返回 409。
      5. 删除被学期引用的模板版本，断言 409 `REFERENCE_PROTECTED` 且数据不变。
      6. 新增停课周，断言周次计算仍占序号且奇偶推进。

      ## 在开始改动之前
