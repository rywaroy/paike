  - id: D05
    name: 排课引擎、方案生命周期与冲突处置
    phase: 2
    priority: P0
    labels: [backend, frontend, timetable, engine]
    estimate_point: 13
    blocked_by: [D01, D02, D03, D04]
    description: |
      ## 目标
      实现确定性排课引擎、方案草稿/发布/覆盖/存档生命周期、锁定、冲突明细、未排课时清单与「只本次忽略」。

      ## 验收标准
      - 硬约束 H1-H12 与软约束 S1-S6 按契约执行；三类核心冲突为 0。
      - D15 输入逐格输出 PRD 附件 A，30 格课程/教师/场地/空格完全一致。
      - 同一输入连续生成 3 次逐格一致；50 班固定数据集 p95 ≤5s。
      - 方案状态机：DRAFT→PUBLISHED→SUPERSEDED/ARCHIVED；每学期至多一个 PUBLISHED。
      - 覆盖发布二次确认；未确认零变更；确认后旧方案 SUPERSEDED 且只读。
      - 锁定课次在生成/调课中不移动、不被覆盖；解锁后可移动。
      - 冲突数 >0 的方案可保存草稿；未排清单含课次、教师、班级、原因、可跳转建议。
      - 「只本次忽略」仅本次生效、不改配置、写审计；容量/锁定/存档冲突不提供忽略。
      - 存档学期写操作返回 409。

      ## 相关背景
      - PRD F8/F9/F17、D13-D15、D19、D21、R-018~R-021、R-034、A-13/A-17/A-19。
      - DDD `ConflictValidationService`、`TimetablePlanLifecycle`、`LessonLockState`。
      - D15 是唯一公共断言基准；禁止修改期望表迁就算法。
      - 并发采用 H-01 乐观版本。

      ## 约束
      - 迁移序号：`0020_timetable_plan.sql`、`0021_timetable_lesson_conflict.sql`。
      - 引擎禁止随机数；固定种子 + 稳定排序；单单元回溯 ≤200、总时长 ≤4.5s。
      - 生成快照只读；不直接写 registry/resource 表。
      - 发布/覆盖/忽略/生成均同事务写业务数据、操作日志与 outbox。
      - 不允许「为凑课时制造冲突」。

      ## 当前阶段
      设计态。定义引擎规则、状态机、表、API 与 D15 断言；不写实现。

      ## 任务
      1. 建表：timetable_plan、lesson、lesson_class、unscheduled_lesson、conflict_detail、conflict_ignore、adjustment_history。
      2. 实现快照读取器（各域 QueryService）。
      3. 实现约束校验器（H1-H12、S1-S6）。
      4. 实现确定性调度器（MRV、槽位排序、有界回溯、超时）。
      5. 实现方案服务：新建/生成/另存/重命名/删除/发布/覆盖/存档联动。
      6. 实现冲突与未排清单、忽略、去配置跳转。
      7. 实现锁定/解锁与生成保留。
      8. 前端：排课页、方案列表、冲突中心、预排与锁定页。
      9. 实现 D15 测试装置（固定锚点 + 逐格断言）。

      ## 验证
      1. 运行 D15 装置，断言 30 格逐格等于附件 A，三类冲突为 0，连续 3 次一致。
      2. 运行 50 班固定数据集基准，断言 p95 ≤5s 且未排课时为 0（或记录原因）。
      3. 发布两次：第二次未确认返回 409，断言旧 PUBLISHED 不变；确认后断言旧 SUPERSEDED、新 PUBLISHED、唯一索引成立。
      4. 锁定课次后重新生成，断言位置不变；拖拽该课次返回 409。
      5. 构造容量不足冲突，断言冲突明细类型/对象/节次/建议齐全，且无忽略入口。
      6. 「只本次忽略」后再次生成，断言冲突再次出现且配置值未变。
      7. 存档学期生成/发布/调课均返回 409。

      ## 在开始改动之前
      - 阅读 PRD F8/F9/F17、附件 A、`p2-contracts.md` §3、A-13~A-17、H-01/H-03。
      - 确认 D01-D04 查询服务可用，D15 锚点已 seed。
      - 不得先写期望表特例；不得用随机重启规避无解。

      ## 完成改动之后
      - 输出 D15 逐格结果与耗时。
      - 输出未排原因码与建议映射。
      - 更新契约与测试结果文档（执行状态按实际填写）。

      ## 测试案例对比验证
      - 涉及用例：TC-AP-001/002/003/004/005/006/008/011/013/014/015/017；TC-CE-001/002/003/004；TC-BD-028/031（引擎侧）；O-AP-001-PERF。
      - 孤儿：TC-AP-012、TC-AP-016、TC-CM-006（参考，不计覆盖）。
      - 已定结果：
        - AP-001 生成方案且三类冲突 0（R）。
        - AP-002 冲突数与耗时展示一致（R）。
        - AP-003 冲突方案含可定位未排清单（G，M-03）。
        - AP-004 冲突方案可保存草稿并重开（G，M-03）。
        - AP-005 多次另存为独立草稿（G，M-02）。
        - AP-006 覆盖发布二次确认、唯一正式（G，M-02）。
        - AP-008 锁定课程位置不变（R）。
        - AP-011 单双周两套结构与视图切换（G，M-05）。
        - AP-013 第 1 周单周、后续奇偶交替（G，M-05）。
        - AP-014 走班占目标场地、教师+场地双分配（G，M-06）。
        - AP-015 跨年级任课不冲突、统计累计（R，A-14）；统计侧由 D11。
        - AP-017 D15 逐格一致（R）。
        - CE-001/002 冲突明细与建议（G，M-04）。
        - CE-003 合法结果零冲突（R）。
        - CE-004 只本次忽略/去配置（R，A-19）。
      - 设计预期结果（静态推演，未执行）：固定种子 + 约束排序可产出附件 A；状态机与冲突模型可覆盖上述断言；D15 不存在写死特例。
      - 一致性判定：一致；AP-012/016 为孤儿，无法验证，本卡不声称覆盖。
      - 执行状态：未执行。

