      实现七类关键操作留痕查询、学期存档（前置已发布、存档只读）与当前学期切换（草稿守卫）。

      ## 验收标准
      - 七类关键操作各产生一条日志，含操作人、时间、模块、内容、对象；日志与操作一一对应。
      - 日志只追加，无更新/删除 API，无自动清理任务；按操作人/时间/模块筛选，时间倒序。
      - 存档前置：当前学期存在 PUBLISHED；否则 409「请先发布正式课表再存档」。
      - 存档事务：学期→ARCHIVED、正式方案→ARCHIVED、写 semester_archive、日志、outbox。
      - 存档后全部写接口 409；查看与导出可用。
      - 切换学期：无草稿直接切换；有草稿未选择返回 `409 DRAFT_EXISTS`；SAVE/DISCARD/CANCEL 行为正确；CANCEL 零写入。
      - 目标学期为 ARCHIVED 时拒绝切换。

      ## 相关背景
      - PRD F19、§5、R-039~R-041、R-026、A-19/A-20、M-19。
      - 存档/切换跨 registry 与 timetable，由本卡应用服务编排，禁止直写他域表。
      - 日志查询仅 Admin。

      ## 约束
      - 迁移序号：`0030_governance.sql`。
      - 日志内容必须中文可读，不存错误码/英文枚举。
      - 不提供日志删除/归档按钮。
      - 存档后不改变已存档快照内容。

      ## 当前阶段
      设计态。定义日志、存档、切换契约；不写实现。

      ## 任务
      1. 建表 operation_log、semester_archive。
      2. 实现日志写入共享内核适配与查询 API。
      3. 实现存档前置检查、事务编排与只读守卫。
      4. 实现切换学期与草稿三选一。
      5. 前端：日志页、存档/切换页、二次确认。
      6. 补充跨域事务测试。

      ## 验证
      1. 依次执行七类操作，断言 operation_log 恰好新增 7 条，字段完整且中文可读。
      2. 未发布方案时存档返回 409，断言状态未变。
      3. 发布后存档成功，断言学期与方案均 ARCHIVED、archive 记录一条；随后 PATCH/生成/调课均 409。
      4. 有未保存草稿时切换未传 `draftResolution` 返回 409 DRAFT_EXISTS；CANCEL 后断言零写入；SAVE 后断言草稿保留并切换。
      5. 按操作人/时间筛选日志，断言结果倒序且不匹配记录不出现。

      ## 在开始改动之前
      - 阅读 PRD F19/§5、`p3-contracts.md` §3.1、A-19/A-20、M-19。
      - 确认 D05 方案状态与 D01 学期生命周期服务可用。
      - 不直接写 registry/timetable 表。

      ## 完成改动之后
      - 输出存档事务边界与日志字段说明。
      - 更新依赖图与契约。
      - 登记日志索引。

      ## 测试案例对比验证
      - 涉及用例：TC-AP-007、TC-LG-001/002/003/004/005、TC-CM-003；O-LG-001-PERM。
      - 已定结果：
        - AP-007 有草稿切换提示保存/放弃（G，M-19）。
        - LG-001 七类操作日志一一对应（R，A-20）；永久留存为永久孤儿。
        - LG-002 筛选与倒序（R）。
        - LG-003 存档前置与成功（R）。
        - LG-004 存档后写操作拒绝、查看可用（R）。
        - LG-005 多学期隔离（R）。
        - CM-003 删除学期/模板不影响存档（G+C）。
      - 设计预期结果（静态推演，未执行）：只追加日志、存档事务与草稿守卫可满足；永久留存无法用有限测试证明。
      - 一致性判定：一致；`O-LG-001-PERM` 永久孤儿，不计覆盖。
      - 执行状态：未执行。

  - id: D08
    name: 用户、角色与教师账号开通
    phase: 3
    priority: P0
    labels: [backend, frontend, identity]
    estimate_point: 8
    blocked_by: [P0-06, D03]
    description: |
      ## 目标
      实现用户 CRUD、角色分配、停用/启用、重置密码、教师一键开通/批量开通与服务端权限边界。

      ## 验收标准
      - 用户列表显示账号、姓名、角色、状态、关联教师；新增/编辑/停用即时反映。
      - 角色仅 ADMIN/TEACHER；角色变更下一请求生效。
      - 用户名大小写不敏感唯一；教师账号 `username=employeeNo` 且 `teacherId` 一对一。
      - `role=TEACHER` 必须关联 `teacherId`；`role=ADMIN` 的 `teacherId` 必须为空。
      - 重复开通幂等：返回既有账号并标记 `alreadyExists=true`，不新增。
      - 初始密码随机 ≥12 位、仅返回一次、`mustChangePassword=true`；日志无明文。
      - 停用立即撤销全部会话；不允许停用/降级最后一个启用 Admin；不允许停用自己。
      - 教师退校事件联动停用账号，复职不自动启用。
      - Teacher 访问任一管理 API 返回 403；前端无管理入口。

      ## 相关背景
      - PRD F20、§4、R-042~R-045、A-18、M-09/M-22、H-02。
      - `sys_user` 由 P0-01 建表；本卡只加唯一索引。
      - 密码策略与会话由 P0-02 提供。

      ## 约束
      - 迁移序号：`0031_identity_indexes.sql`。
      - 不实现第二种角色；不引入外部 IdP。
      - 不返回密码哈希；不在响应中重复展示初始密码。
      - 跨域只调用 resource 查询服务读教师信息。

      ## 当前阶段
      设计态。定义 API、权限与开通流程；不写实现。

      ## 任务
      1. 增加用户名/教师唯一索引。
      2. 实现用户 CRUD、角色、停用/启用、重置密码。
      3. 实现教师开通/批量开通与凭据 CSV。
      4. 实现最后 Admin/自身保护。
      5. 订阅教师退校事件并停用账号。
      6. 前端：用户与角色页、开通抽屉、凭据一次性展示。
      7. 补充权限边界测试。

      ## 验证
      1. 新建用户、改角色、停用后断言列表即时反映；下一请求角色生效。
      2. 停用账号后旧会话请求返回 401。
      3. 重复开通同一教师，断言返回 `alreadyExists=true` 且 `sys_user` 记录数不变。
      4. 重置密码后断言旧密码失败、新密码首次登录强制改密、日志无密码。
      5. 尝试停用最后一个 Admin 或自己，断言 409 且状态不变。
      6. Teacher 调用 `/users`、`/semesters`、`/timetable-plans` 均返回 403。

      ## 在开始改动之前
      - 阅读 PRD F20/§4、`p3-contracts.md` §3.2、A-18、H-02、M-09/M-22。
      - 确认 P0-02 密码与会话导出、D03 教师查询服务可用。
      - 不复制原型用户页（缺失）。

      ## 完成改动之后
      - 输出开通/停用/重置流程与文案。
      - 输出权限边界测试清单。
      - 更新契约与事件。

      ## 测试案例对比验证
      - 涉及用例：TC-AU-004/007/008/009；TC-BD-022/023（账号侧）；O-BD-022-LOGIN、O-AU-009-LOGIN。
      - 已定结果：
        - AU-004 用户 CRUD 与角色（G，M-09）。
        - AU-007 越权拒绝（R）。
        - AU-008 管理员通行（R）。
        - AU-009 开通账号权限边界 Teacher（R）；首登子断言另列。
        - BD-022/023 开通唯一与重复幂等（G/C）。
      - 设计预期结果（静态推演，未执行）：唯一索引、幂等开通与每请求角色判定可满足；登录链路由 P0-02/P0-08 验证。
      - 一致性判定：一致。
      - 孤儿说明：AU-001/002/003/005 不计覆盖；登录子断言由 H-02 转可执行。
