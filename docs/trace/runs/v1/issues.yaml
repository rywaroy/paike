        - AS-002 加班占位、不计总课时、明示 V1.1（R）。
        - AS-003 周/学期口径与导出一致（R）。
        - AP-015 跨年级累计正确（R）。
      - 设计预期结果（静态推演，未执行）：优先分类与口径过滤可满足；导出一致性由 D10 验证。
